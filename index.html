<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color tints the mobile browser chrome (Safari URL
         bar, Chrome status bar) so it blends with the page's
         espresso background instead of staying its default
         off-white / system-dark. Without this the URL bar reads
         as a foreign panel hovering on top of the site. Value
         matches CSS --bg in src/index.css. -->
    <meta name="theme-color" content="#16110D" />
    <!-- Disable iOS Safari's data detectors. Without this, the
         viewer-email watermark on /review (which animates every
         frame) repeatedly triggers iOS's "compose mail" sheet
         every few seconds, because the OS re-detects the email
         string each time the DOM moves. Same hint covers phone
         numbers, addresses and dates so we don't accidentally
         create tappable overlays on copy that wasn't meant to
         be actionable. -->
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no, date=no"
    />
    <title>ניהול הורדות פלוס — תוכנה ליוצרי תוכן ועורכי וידאו</title>
    <meta
      name="description"
      content='יוצרי תוכן ועורכי וידיאו? זה בשבילכם, "ניהול הורדות פלוס" התוכנה שתסדר לכם את ההורדות לפי פרוייקטים, תוריד לכם סרטונים, תמיר קבצים, תבנה הצעות מחיר ותפתור לכם הרבה כאב ראש'
    />
    <meta property="og:title" content="ניהול הורדות פלוס" />
    <meta
      property="og:description"
      content='יוצרי תוכן ועורכי וידיאו? זה בשבילכם, "ניהול הורדות פלוס" התוכנה שתסדר לכם את ההורדות לפי פרוייקטים, תוריד לכם סרטונים, תמיר קבצים, תבנה הצעות מחיר ותפתור לכם הרבה כאב ראש'
    />
    <meta property="og:image" content="https://www.dmplus.net/icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="ניהול הורדות פלוס" />
    <meta property="og:type" content="website" />
    <!-- twitter:card = "summary" forces a small square thumbnail next
         to the text rather than a huge banner above it. WhatsApp/
         Telegram pick the same hint up and shrink the preview image
         to a proper inline size. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ניהול הורדות פלוס" />
    <meta
      name="twitter:description"
      content='יוצרי תוכן ועורכי וידיאו? זה בשבילכם, "ניהול הורדות פלוס" התוכנה שתסדר לכם את ההורדות לפי פרוייקטים, תוריד לכם סרטונים, תמיר קבצים, תבנה הצעות מחיר ותפתור לכם הרבה כאב ראש'
    />
    <meta name="twitter:image" content="https://www.dmplus.net/icon.png" />
    <meta name="twitter:image:alt" content="ניהול הורדות פלוס" />

    <!-- ── SEO: canonical, crawl directives, brand identity ──
         Canonical host is www (the apex 307-redirects to it). These
         help the brand name + its variations surface for branded
         searches without keyword stuffing. -->
    <link rel="canonical" href="https://www.dmplus.net/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="ניהול הורדות פלוס" />
    <meta name="author" content="ניהול הורדות פלוס" />
    <meta property="og:site_name" content="ניהול הורדות פלוס" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://www.dmplus.net/" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="apple-mobile-web-app-title" content="ניהול הורדות פלוס" />

    <!-- ── Structured data (JSON-LD) ──
         Organization + WebSite + SoftwareApplication. alternateName
         lists the real name variations (Hebrew / English / short
         forms) so Google maps every spelling to this one brand. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.dmplus.net/#organization",
            "name": "ניהול הורדות פלוס",
            "alternateName": ["Download Manager Plus", "DM Plus", "DMPlus", "dmplus"],
            "url": "https://www.dmplus.net/",
            "logo": "https://www.dmplus.net/icon.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.dmplus.net/#website",
            "name": "ניהול הורדות פלוס",
            "alternateName": ["Download Manager Plus", "DM Plus", "DMPlus", "DM+", "dmplus", "ניהול הורדות +", "דיאם פלוס"],
            "url": "https://www.dmplus.net/",
            "inLanguage": "he-IL",
            "publisher": { "@id": "https://www.dmplus.net/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://www.dmplus.net/#app",
            "name": "ניהול הורדות פלוס",
            "alternateName": ["Download Manager Plus", "DM Plus", "DMPlus"],
            "description": "תוכנה ליוצרי תוכן ועורכי וידאו: ניהול ומיון הורדות לפי פרויקטים, הורדת סרטונים, המרת קבצים, סבבי תיקונים מול לקוחות, מסירה ללקוח, הצעות מחיר וניהול תשלומים.",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "macOS, Windows",
            "inLanguage": "he-IL",
            "url": "https://www.dmplus.net/",
            "downloadUrl": "https://www.dmplus.net/",
            "image": "https://www.dmplus.net/icon.png",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "ILS",
              "description": "הורדה חינם; מנוי Pro בתשלום החל מ-5 ₪ לחודש"
            },
            "publisher": { "@id": "https://www.dmplus.net/#organization" }
          }
        ]
      }
    </script>
    <!-- Fonts are self-hosted (src/fonts.css). No Google Fonts request. -->
  </head>
  <!--
    body bg matches CSS --bg (espresso #16110D). The previous value
    #0b0b14 was a dark-blue-black leftover from an earlier template
    and was visible on iOS in the rubber-band overscroll area — the
    page looked like it had a second "blue" layer beneath the
    espresso content, which read as broken/unprofessional. Inline
    style keeps the right color visible even before the React app
    + main stylesheet boot.
  -->
  <body style="background-color: #16110D; color: #F5EFE6" class="antialiased">
    <div id="root"></div>
    <!--
      The PayPal Smart Buttons SDK used to be loaded here with a
      static script tag whose client-id came from a Vite HTML env
      placeholder. That substitution didn't run reliably on Vercel
      (the literal placeholder reached production and PayPal returned
      400), so we now inject the script at runtime from the BuyPage
      component using import.meta.env, which IS always replaced by
      Vite at build time. Side benefit: visitors who never reach
      /buy don't pay the cost of loading PayPal's SDK.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
