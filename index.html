<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ניהול הורדות פלוס</title>
    <meta
      name="description"
      content='יוצרי תוכן ועורכי וידיאו? זה בשבילכם, "ניהול הורדות פלוס" התוכנה שתסדר לכם את ההורדות לפי פרוייקטים, תוריד לכם סרטונים, תמיר קבצים, תבנה הצעות מחיר ותפטור לכם הרבה כאב ראש'
    />
    <meta property="og:title" content="ניהול הורדות פלוס" />
    <meta
      property="og:description"
      content='יוצרי תוכן ועורכי וידיאו? זה בשבילכם, "ניהול הורדות פלוס" התוכנה שתסדר לכם את ההורדות לפי פרוייקטים, תוריד לכם סרטונים, תמיר קבצים, תבנה הצעות מחיר ותפטור לכם הרבה כאב ראש'
    />
    <meta property="og:image" content="https://dm-plus.vercel.app/icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="ניהול הורדות פלוס" />
    <meta property="og:type" content="website" />
    <!-- twitter:card = "summary" forces a small square thumbnail next
         to the text rather than a huge banner above it. WhatsApp/
         Telegram pick the same hint up and shrink the preview image
         to a proper inline size. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ניהול הורדות פלוס" />
    <meta
      name="twitter:description"
      content='יוצרי תוכן ועורכי וידיאו? זה בשבילכם, "ניהול הורדות פלוס" התוכנה שתסדר לכם את ההורדות לפי פרוייקטים, תוריד לכם סרטונים, תמיר קבצים, תבנה הצעות מחיר ותפטור לכם הרבה כאב ראש'
    />
    <meta name="twitter:image" content="https://dm-plus.vercel.app/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0b0b14] text-white antialiased">
    <div id="root"></div>
    <!--
      PayPal Smart Buttons SDK. Vite replaces `%VITE_…%` tokens in
      index.html at build time, so the client-id baked into the
      bundle is whatever VITE_PAYPAL_CLIENT_ID is set to in the
      Vercel project. Currency pinned to ILS; credit-card funding
      disabled because we want to keep the flow purely inside
      PayPal's own checkout, not the card form.
    -->
    <script
      src="https://www.paypal.com/sdk/js?client-id=%VITE_PAYPAL_CLIENT_ID%&currency=ILS&intent=capture&disable-funding=credit"
      data-namespace="paypal"
    ></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
