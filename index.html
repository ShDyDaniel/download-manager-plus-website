<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color tints the mobile browser chrome (Safari URL
         bar, Chrome status bar) so it blends with the page's
         espresso background instead of staying its default
         off-white / system-dark. Without this the URL bar reads
         as a foreign panel hovering on top of the site. Value
         matches CSS --bg in src/index.css. -->
    <meta name="theme-color" content="#16110D" />
    <title>ניהול הורדות פלוס</title>
    <meta
      name="description"
      content='יוצרי תוכן ועורכי וידיאו? זה בשבילכם, "ניהול הורדות פלוס" התוכנה שתסדר לכם את ההורדות לפי פרוייקטים, תוריד לכם סרטונים, תמיר קבצים, תבנה הצעות מחיר ותפטור לכם הרבה כאב ראש'
    />
    <meta property="og:title" content="ניהול הורדות פלוס" />
    <meta
      property="og:description"
      content='יוצרי תוכן ועורכי וידיאו? זה בשבילכם, "ניהול הורדות פלוס" התוכנה שתסדר לכם את ההורדות לפי פרוייקטים, תוריד לכם סרטונים, תמיר קבצים, תבנה הצעות מחיר ותפטור לכם הרבה כאב ראש'
    />
    <meta property="og:image" content="https://dm-plus.vercel.app/icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="ניהול הורדות פלוס" />
    <meta property="og:type" content="website" />
    <!-- twitter:card = "summary" forces a small square thumbnail next
         to the text rather than a huge banner above it. WhatsApp/
         Telegram pick the same hint up and shrink the preview image
         to a proper inline size. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ניהול הורדות פלוס" />
    <meta
      name="twitter:description"
      content='יוצרי תוכן ועורכי וידיאו? זה בשבילכם, "ניהול הורדות פלוס" התוכנה שתסדר לכם את ההורדות לפי פרוייקטים, תוריד לכם סרטונים, תמיר קבצים, תבנה הצעות מחיר ותפטור לכם הרבה כאב ראש'
    />
    <meta name="twitter:image" content="https://dm-plus.vercel.app/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <!--
    body bg matches CSS --bg (espresso #16110D). The previous value
    #0b0b14 was a dark-blue-black leftover from an earlier template
    and was visible on iOS in the rubber-band overscroll area — the
    page looked like it had a second "blue" layer beneath the
    espresso content, which read as broken/unprofessional. Inline
    style keeps the right color visible even before the React app
    + main stylesheet boot.
  -->
  <body style="background-color: #16110D; color: #F5EFE6" class="antialiased">
    <div id="root"></div>
    <!--
      The PayPal Smart Buttons SDK used to be loaded here with a
      static script tag whose client-id came from a Vite HTML env
      placeholder. That substitution didn't run reliably on Vercel
      (the literal placeholder reached production and PayPal returned
      400), so we now inject the script at runtime from the BuyPage
      component using import.meta.env, which IS always replaced by
      Vite at build time. Side benefit: visitors who never reach
      /buy don't pay the cost of loading PayPal's SDK.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
